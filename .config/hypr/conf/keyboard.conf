input {
    kb_layout = be
    kb_variant =
    kb_model =
    kb_options =
    numlock_by_default = true
    mouse_refocus = false

    follow_mouse = 2
    touchpad {
        # for desktop
        natural_scroll = false
        
        # for laptop
        # natural_scroll = yes
        # middle_button_emulation = true
        # clickfinger_behavior = false     
        scroll_factor = 1.0  # Touchpad scroll factor
    }

    sensitivity = -0.6  # Pointer speed: -1.0 - 1.0, 0 means no modification.

    repeat_delay = 220
    repeat_rate = 40
}

gestures {
}
