source = $HOME/.config/belmu/vars.conf

general {
    ignore_empty_input = true
}

background {
    monitor =
    path = $BELMU/wallpapers/wallpaper_0.png  # only png supported for now
}

background {
    monitor = DP-1
    path = $BELMU/wallpapers/wallpaper_0.png
}

background {
    monitor = DP-2
    path = $BELMU/wallpapers/wallpaper_1.png
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 0
    dots_size = 0.2  # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.30  # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1  # -1 default circle, -2 follow input-field rounding
    outer_color = rgb(000000)
    inner_color = rgb(FFFFFF)
    font_color = rgb(0, 0, 0)
    fade_on_empty = false
    fade_timeout = 1000  # Milliseconds before fade_on_empty is triggered.
    placeholder_text = PASSWORD  # Text rendered in the input box when it's empty.
    hide_input = false
    rounding = 40  # -1 means complete rounding (circle/oval)
    check_color = rgb(C9778B)
    fail_color = rgb(C9778B)  # if authentication failed, changes outer_color and fail message color
    fail_text = $FAIL <b>($ATTEMPTS)</b>  # can be set to empty
    fail_transition = 10  # transition time in ms between normal outer_color and fail_color
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1  # when both locks are active. -1 means don't change outer color (same for above)
    invert_numlock = false  # change color if numlock is off
    swap_font_color = false  # see below
    position = 0, -160
    halign = center
    valign = center
    shadow_passes = 0
    shadow_size = 20
    shadow_color = rgb(0,0,0)
    shadow_boost = 1.0
}

label {
    monitor =
    #clock
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(C9778B)
    font_size = 55
    font_family = JetBrainsMono Nerd Font
    position = 0, -60
    halign = center
    valign = top
    shadow_passes = 0
    shadow_size = 10
}

label {
    monitor =
    text =  #<b>$USER</b>
    color = rgb(C9778B)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0,350
    halign = center
    valign = center
    shadow_passes = 0
    shadow_size = 10
}

image {
    monitor =
    path = $BELMU_WALLPAPERS/wallpaper_0_square.png
    size = 280  # lesser side if not 1:1 ratio
    rounding = 20  # negative values mean circle
    border_size = 2
    border_color = rgb(C9778B)
    rotate = 0  # degrees, counter-clockwise
    reload_time = -1  # seconds between reloading, 0 to reload with SIGUSR2
#    reload_cmd =  # command to get new path. if empty, old path will be used. don't run "follow" commands like tail -F
    position = 0, 40
    halign = center
    valign = center
    shadow_passes = 0
    shadow_size = 20
    shadow_color = rgb(0,0,0)
    shadow_boost = 1.6
}
